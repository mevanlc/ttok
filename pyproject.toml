[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ttok"
dynamic = ["version"]
description = "Count and truncate text based on tokens"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Simon Willison" }]
dependencies = [
    "click>=8.3.1",
    "tiktoken>=0.12.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/simonw/ttok"
Issues = "https://github.com/simonw/ttok/issues"
CI = "https://github.com/simonw/ttok/actions"
Changelog = "https://github.com/simonw/ttok/releases"

[project.scripts]
ttok = "ttok.cli:cli"

[dependency-groups]
test = [
    "cogapp>=3.6.0",
    "pytest>=9.0.0",
]

[tool.setuptools]
packages = ["ttok"]

[tool.setuptools.dynamic]
version = { attr = "ttok.__version__" }
